[project]
name = "ml-playground"
version = "0.1.0"
description = "機械学習の分類器とハイパーパラメータ探索（グリッドサーチ / ランダムサーチ / TPE）を視覚的に学べるプレイグラウンド"
requires-python = ">=3.14"
dependencies = [
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "optuna>=5.0.0",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "streamlit>=1.64.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "scipy>=1.18.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# 性能目標を確かめる計時テストは既定の実行から外す (AD-15)。負荷で揺れるため。
# 実行するときは `uv run pytest -m timing`。ハング検出の緩い上限はマーカーを付けず既定の実行に残す
markers = [
    "timing: 性能目標 (所要時間) を確かめるテスト。既定では実行しない (-m timing で実行)",
    "scale: 大規模な条件での検証 (AD-17)。既定では実行しない。テスト品質チームが予約枠で -m scale を付けて流す",
    "claim: 教える主張の ID を付ける目印 (例: claim(\"S1\"))。実行には影響しない。tests/test_claims_consistency.py が tests/claims_registry.py と突き合わせる",
]
addopts = "-m 'not timing and not scale'"
